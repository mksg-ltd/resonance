[project]
name = "resonance"
version = "0.1.0"
description = "Semantic search over song lyrics using Qdrant and OpenAI embeddings"
authors = [{ name = "MK", email = "mk@mk.sg" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "fastmcp>=3.0.0,<4.0.0",
    "httpx>=0.28.0",
    "openai>=2.29.0",
    "pydantic-settings>=2.9.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "qdrant-client>=1.17.1",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.12.0",
    "ty>=0.0.1a15",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resonance"]

[tool.hatch.build.targets.wheel.force-include]
"src/resonance/data/embedding_profiles.yaml" = "resonance/data/embedding_profiles.yaml"

[project.scripts]
resonance-ingest = "resonance.ingest:main"
resonance-search = "resonance.search:main"
resonance-server = "resonance.app:cli"
resonance-dev = "resonance.app:dev"
resonance-playlist = "resonance.playlists:main"
resonance-library = "resonance.library:main"

[tool.ruff]
exclude = [
    ".venv",
    "__pycache__",
]
line-length = 120
src = ["src"]
target-version = "py314"

[tool.ruff.lint]
select = [
    "A", "ASYNC", "B", "BLE", "C4", "C90", "COM", "DTZ",
    "E", "EM", "ERA", "EXE", "F", "FA", "FBT", "FLY", "G",
    "I", "ICN", "INP", "INT", "ISC", "N", "PERF", "PGH", "PIE",
    "PL", "PT", "PTH", "PYI", "Q", "RET", "RSE", "RUF", "S",
    "SIM", "SLF", "SLOT", "T10", "T20", "TID", "TRY", "UP", "W", "YTT",
]
ignore = [
    "C901", "COM812", "PLC0415", "PLR0911", "PLR0912", "PLR2004",
    "S110",
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["BLE001", "S101", "S106", "SLF001"]
"src/resonance/ingest.py" = ["T201"]
"src/resonance/search.py" = ["T201"]
"src/resonance/routes/ingest.py" = ["T201"]
"src/resonance/chunks.py" = ["T201"]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = [".venv"]

[tool.ty.rules]
unresolved-attribute = "ignore"
unresolved-import = "ignore"
invalid-return-type = "ignore"
not-subscriptable = "ignore"
unsupported-operator = "ignore"
invalid-argument-type = "ignore"
invalid-type-form = "ignore"
