[project]
name = "lrc-match"
version = "0.1.0"
description = "Semantic search over song lyrics using Qdrant and OpenAI embeddings"
requires-python = ">=3.14"
dependencies = [
    "openai>=2.29.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lrc_match"]

[project.scripts]
lrc-ingest = "lrc_match.ingest:main"
lrc-search = "lrc_match.search:main"
