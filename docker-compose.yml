services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - ./qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
  resonance:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - /home/mk/mnt/homelab-data/media/music/tamil:/app/music/tamil:ro
      - /home/mk/mnt/homelab-data/media/music/english:/app/music/english:ro
      - /home/mk/mnt/homelab-data/media/music/tamil/playlists:/app/music/tamil/playlists:rw
      - /home/mk/mnt/homelab-data/media/music/english/playlists:/app/music/english/playlists:rw
    environment:
      - RESONANCE__SERVER__DEBUG=true
      - RESONANCE__QDRANT__URL=http://qdrant:6333
    depends_on:
      - qdrant
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  # HuggingFace Text Embeddings Inference — serves any HF embedding model
  # with an OpenAI-compatible API. Use for models that can't run on Ollama
  # (e.g., XLM-RoBERTa-based models like Vyakyarth).
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    ports:
      - "8085:80"
    volumes:
      - ./tei_cache:/data
    environment:
      - MODEL_ID=krutrim-ai-labs/Vyakyarth
      - MAX_BATCH_TOKENS=16384
